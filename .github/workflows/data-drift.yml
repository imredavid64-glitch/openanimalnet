name: Data Drift Watch

# Weekly check that every species' recorded IUCN ID / status / Wikipedia
# article still matches live sources. Fails loudly on drift so the team can
# update src/data/sample/sources.ts (and the sample data) before the data
# goes stale. Can also be triggered manually from the Actions tab.

on:
  schedule:
    - cron: '0 3 * * 1' # 03:00 UTC every Monday
  workflow_dispatch:

jobs:
  source-drift:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22.6+ required: the checker imports a .ts file directly via type
      # stripping (see .freebuff/refresh-sources.mjs).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify sources against live Wikidata/Wikipedia
        run: npm run refresh:data -- --fail

      - name: Verify every species across Wikidata, Wikipedia, GBIF, and iNaturalist
        # --report also regenerates src/data/verification-report.json, the
        # source of truth for the public /data-quality page (verified fresh,
        # committed via the usual PR flow).
        run: npm run verify:data -- --fail --report

  taxonomy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify species taxonomy classes against live Wikidata
        run: npm run check:taxonomy
