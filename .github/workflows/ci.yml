name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    # Node 22.6+ required: the unit/integration tests import .ts files
    # directly (type stripping), and the build runs on the same runtime.
    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: API integration tests
        run: |
          npx next start -p 3100 &
          SERVER_PID=$!
          # Wait for the server to answer before running the tests.
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:3100; then
              echo "Server ready after ${i} tries"
              break
            fi
            sleep 2
          done
          API_BASE_URL=http://localhost:3100 npm run test:api
          kill $SERVER_PID
