name: Taxonomy Check

# Weekly check that every species' recorded taxonomy class still matches live
# Wikidata (the P171 chain is paraphyletic — birds pass through Reptilia — so
# a regression would silently produce wrong classes). Also runnable on demand
# from the Actions tab.

on:
  schedule:
    - cron: '15 3 * * 1' # every Monday 03:15 UTC
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify species taxonomy against Wikidata
        run: npm run check:taxonomy
