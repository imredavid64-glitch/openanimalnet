name: Deploy to Vercel

# Auto-deploy production on every push to main. Secrets are set in the repo:
#   VERCEL_TOKEN      — Vercel CLI auth token (com.vercel.cli auth.json)
#   VERCEL_ORG_ID     — from .vercel/project.json (orgId)
#   VERCEL_PROJECT_ID — from .vercel/project.json (projectId)
#
# Deploy via the Vercel CLI directly: the amondnet/vercel-action@v20 action
# targets Node 20 and broke when GitHub started forcing it onto Node 24
# ("The process '/usr/local/bin/npx' failed with exit code 1").

on:
  push:
    branches: [main]
  # Manual redeploy without a push (e.g. after rotating VERCEL_TOKEN).
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy to Vercel (production)
        id: deploy
        run: |
          set +e
          npx --yes vercel@latest deploy --prod --token "$VERCEL_TOKEN" --yes > /tmp/vercel-deploy.log 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/vercel-deploy.log
          exit $code
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Diagnostics: the Actions run logs are admin-only, so on failure file
      # the Vercel CLI output as a repo issue where it's visible to everyone.
      - name: Report deploy failure
        if: ${{ always() && steps.deploy.outputs.exit_code != '' && steps.deploy.outputs.exit_code != '0' }}
        run: |
          tail -120 /tmp/vercel-deploy.log > /tmp/vercel-tail.log
          body=$(sed 's/^/    /' /tmp/vercel-tail.log)
          gh api -X POST "repos/${{ github.repository }}/issues" \
            -f title="Vercel deploy failed on ${{ github.sha }}" \
            -f body="$body"
        env:
          GH_TOKEN: ${{ github.token }}
