name: Deploy to Vercel

# Auto-deploy production on every push to main. Secrets are set in the repo:
#   VERCEL_TOKEN      — Vercel CLI auth token (com.vercel.cli auth.json)
#   VERCEL_ORG_ID     — from .vercel/project.json (orgId)
#   VERCEL_PROJECT_ID — from .vercel/project.json (projectId)

on:
  push:
    branches: [main]
  # Manual redeploy without a push (e.g. after rotating VERCEL_TOKEN).
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Vercel (production)
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
